# .github/workflows/scheduled-fetch.yml
name: Scheduled fetch (PoC)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "35 11 * * *"
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch script
        env:
          # You can replace this later with the real site/API endpoint you want to monitor.
          FETCH_URL: "https://httpbin.org/json"
          FETCH_TIMEOUT_SECONDS: "20"
        run: |
          python request_poc.py
      - name: Notify Telegram (always)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS="${{ job.status }}"
          TEXT="🏠 Scheduled fetch finished: ${STATUS}%0ARepo: ${{ github.repository }}%0ARun: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${TEXT}" \
            -d "disable_web_page_preview=true"
        
        
      
